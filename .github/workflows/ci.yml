name: CI

# Branch pushes only: a release tag points at a commit that was just tested.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        # Failing tests become annotations, readable without logging in.
        run: |
          set +e  # Actions runs bash with -e -o pipefail
          flags=""
          if [ "$RUNNER_OS" = Linux ]; then flags=-race; fi
          go test $flags ./... 2>&1 | tee test.log; rc=${PIPESTATUS[0]}
          if [ $rc != 0 ]; then
            { grep -E -- '--- FAIL|^FAIL|panic:|DATA RACE|_test.go:[0-9]+:' test.log | head -20; echo '--- end of the log:'; tail -n 25 test.log; } > failures.txt
            # One annotation with all lines (%0A = line break).
            echo "::error title=go test failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' failures.txt)"
          fi
          exit $rc
      - name: Tray over D-Bus (not race-safe inside fyne.io/systray)
        if: runner.os == 'Linux'
        run: go test -run TrayOverDBus ./internal/tray

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make dist
      - uses: actions/upload-artifact@v5
        with:
          name: herakles-binaries
          path: dist/
