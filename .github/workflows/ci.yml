name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Tray over D-Bus (not race-safe inside fyne.io/systray)
        if: runner.os == 'Linux'
        run: go test -run TrayOverDBus ./internal/tray
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: herakles-binaries
          path: dist/
