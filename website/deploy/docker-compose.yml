# Herakles website (https://herakles.kloeck-it.de): static pages + downloads.
# Deployed by website/deploy/deploy.sh from the Herakles repository.
# www/current -> www/releases/<timestamp> (swapped atomically on deploy),
# www/downloads holds the release binaries.
services:
  web:
    image: nginx:1.27-alpine
    container_name: herakles-web
    restart: unless-stopped
    volumes:
      - ./www:/srv/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.herakles-web.rule=Host(`herakles.kloeck-it.de`)
      - traefik.http.routers.herakles-web.entrypoints=websecure
      - traefik.http.routers.herakles-web.tls=true
      - traefik.http.routers.herakles-web.tls.certresolver=le
      - traefik.http.services.herakles-web.loadbalancer.server.port=80

networks:
  proxy:
    external: true
